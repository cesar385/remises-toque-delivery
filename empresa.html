<!doctype html>

<head>

<title>Remises TOQUE! · Empresas</title>

<style>
/* pie de la pantalla de ingreso: ayuda y legales ordenados */
.ing-pie{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.ing-tit{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#637684;margin-top:4px}
.ing-tit:before,.ing-tit:after{content:"";flex:1;height:1px;background:#e3eaee}
.ing-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ing-grid a{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;padding:9px 10px;border:1px solid #dde6ed;border-radius:14px;background:#f7f9fb;text-decoration:none;color:#183c62;min-width:0;transition:background .15s,border-color .15s}
.ing-grid a:hover,.ing-grid a:focus-visible{background:#eaf2fa;border-color:#b9d0e6}
.ing-grid .ic{grid-row:1/3;width:32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 1px 3px rgba(15,39,64,.1)}
.ing-grid b{font-size:14px;line-height:1.2}
.ing-grid small{font-size:12px;color:#637684;line-height:1.2}
.ing-apk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:#eaf6e1;border:1px solid #c6e3ae;text-decoration:none;color:#2f6512}
.ing-apk .ic{font-size:22px}.ing-apk b{display:block;font-size:14.5px}.ing-apk small{display:block;font-size:12px;color:#4a7a2c}.ing-apk .fl{margin-left:auto;font-size:22px}
.ing-legal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ing-legal a{display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 8px;border-radius:12px;border:1px solid #dde6ed;background:#fff;color:#55666a;font-size:12.5px;font-weight:700;text-decoration:none;line-height:1.25}
.ing-legal a:hover{background:#f4f7fa;color:#183c62}
@media (max-width:340px){.ing-grid,.ing-legal{grid-template-columns:1fr}}
/* botones de pie del ingreso (mismo diseño que las otras apps) */
.otros-ingresos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:18px;font-size:13.5px;color:#55666a}
.otros-ingresos>span{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#637684;margin-bottom:2px}
.otros-ingresos>span:before,.otros-ingresos>span:after{content:"";flex:1;height:1px;background:#e3eaee}
.otros-ingresos a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#f4f7fa;border:1px solid #dde6ed;color:#183c62;font-weight:600;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,transform .15s}
.otros-ingresos a:hover,.otros-ingresos a:focus-visible{background:#e8f1fa;border-color:#b9d0e6;transform:translateY(-1px)}
.otros-ingresos a.dest{background:#eaf6e1;border-color:#c6e3ae;color:#3c7a17}
.otros-ingresos a.dest:hover{background:#dff0d1;border-color:#a9d48a}
.otros-ingresos+.otros-ingresos{margin-top:12px}
:root{--az:#1f4e79;--az2:#163a5c;--az3:#0f2740;--ve:#4a8125;--ve2:#3f7a1d;--rojo:#d43d3d;--nar:#e8892b;--txt:#0f2740;--suave:#627280;--borde:#e1e8ef;--fondo:#eef2f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:var(--fondo);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1.5px solid #d5dee6;border-radius:11px;padding:10px 12px;background:#fff;min-height:44px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--az);box-shadow:0 0 0 3px rgba(31,78,121,.13)}
.campo{display:flex;flex-direction:column;gap:4px}.campo label{font-size:12px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;background:var(--az);color:#fff;font-weight:800;cursor:pointer;min-height:44px;text-decoration:none}
.btn:hover{background:var(--az2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--az);border:1.5px solid #c9d7e4}.btn.sec:hover{background:#f3f7fb}
.btn.verde{background:var(--ve)}.btn.verde:hover{background:var(--ve2)}.btn.rojo{background:#fff;color:var(--rojo);border:1.5px solid #f3c7c7}
.btn.chico{padding:6px 12px;min-height:34px;font-size:13.5px;border-radius:10px}.btn.grande{width:100%;padding:14px;font-size:16.5px}
.oculto{display:none!important}
#toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#233;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;font-weight:600}.toast.ok{background:var(--ve2)}.toast.error{background:var(--rojo)}
/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f2740,#1f4e79 60%,#3f7d2a)}
.login .caja{background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.login img{width:200px;max-width:70%;align-self:center}
.login .tag{align-self:center;background:var(--az);color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;letter-spacing:.6px}
.login p.sub{margin:0;text-align:center;color:var(--suave)}
.login .ventajas{margin:0;padding:12px 14px 12px 32px;background:#f3f7fb;border-radius:14px;color:#33475b;font-size:14px;line-height:1.5}
.pass{position:relative}.pass button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:19px;cursor:pointer;padding:6px}
.err{background:#fde8eb;color:#9b1c2e;border-radius:10px;padding:9px 12px;font-size:14px;display:none}
.login .pie{text-align:center;font-size:13px;color:var(--suave)}.login .pie a{color:var(--az);font-weight:700}
/* app */
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;background:var(--az3);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));flex:none}
.top img{height:38px}.top .emp{display:flex;flex-direction:column;line-height:1.15;min-width:0}.top .emp b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .emp small{opacity:.75;font-size:12px}
.top .esp{flex:1}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;color:#c9d9ea;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;position:relative}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}.tabs button.on{background:rgba(255,255,255,.14);color:#fff}
.tabs .ic{font-size:17px}.badge{background:var(--nar);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.badge:empty{display:none}
.cuerpo{flex:1;display:flex;min-height:0}
.panel{width:440px;flex:none;overflow:auto;padding:16px;background:var(--fondo)}
.cuerpo.sin-mapa .panel{width:100%;max-width:1100px;margin:0 auto}
.mapa-box{flex:1;position:relative;min-height:0}#mapa{position:absolute;inset:0}
.cuerpo.sin-mapa .mapa-box{display:none}
.tit{margin:0 0 4px;font-size:21px}.sub{margin:0 0 14px;color:var(--suave);font-size:14px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(15,39,64,.08);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
.fila{display:flex;gap:8px;align-items:center}.fila>*{min-width:0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* pedir */
.paso{display:flex;gap:10px;align-items:center;margin-bottom:8px}.paso i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--az);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}.paso b{font-size:15px}
.buscador{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--borde);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:1200;max-height:280px;overflow:auto}
.sug div{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f3f6}.sug div:hover,.sug div.on{background:#eef4fa}.sug small{display:block;color:var(--suave);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1.5px solid #d5dee6;background:#fff;border-radius:999px;padding:6px 11px;font-size:13.5px;cursor:pointer;color:#33475b}.chips button:hover{border-color:var(--az);color:var(--az)}
.chips button.on{background:var(--az);border-color:var(--az);color:#fff}
.pas-sel{display:flex;align-items:center;gap:10px;background:#eef4fa;border:1.5px solid #c9d7e4;border-radius:12px;padding:9px 12px}
.pas-sel .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--az);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.pas-sel b{display:block}.pas-sel small{color:var(--suave)}.pas-sel .x{margin-left:auto}
.dir{display:flex;gap:8px;align-items:center}.dir .pt{flex:none;width:14px;height:14px;border-radius:50%}.dir .pt.o{background:#278449;box-shadow:0 0 0 4px #dff3e6}.dir .pt.d{background:#2a86e8;box-shadow:0 0 0 4px #dcebfb}
.dir .buscador{flex:1}.dir .mp{flex:none;width:44px;height:44px;border-radius:11px;border:1.5px solid #d5dee6;background:#fff;cursor:pointer;font-size:18px}.dir .mp.on{border-color:var(--az);background:#eef4fa}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef2f6;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:800;color:var(--suave);cursor:pointer}.seg button.on{background:#fff;color:var(--az);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.est{display:flex;justify-content:space-between;align-items:center;background:#0f2740;color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0}
.est small{opacity:.8;display:block;font-size:12.5px}.est b{font-size:24px}
.cc{display:inline-flex;align-items:center;gap:6px;background:#e3f6e8;color:#1b6e31;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:#33475b;cursor:pointer}.chk input{width:18px;height:18px;min-height:0;accent-color:var(--az)}
.ayuda{font-size:12.5px;color:var(--suave);margin:6px 2px 0}
/* viajes */
.vj{background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 1px 3px rgba(15,39,64,.08);margin-bottom:10px;border-left:5px solid var(--c,#8b9899)}
.vj .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.est-v{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--c,#555)}.est-v i{width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
.vj .pas{font-weight:800;font-size:16px}.vj .pas small{font-weight:400;color:var(--suave);font-size:13px;margin-left:6px}
.ruta{margin:6px 0;display:flex;flex-direction:column;gap:3px;font-size:14px;color:#33475b}.ruta div{display:flex;gap:8px;align-items:flex-start}.ruta i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px}.ruta i.o{background:#278449}.ruta i.d{background:#2a86e8}
.mov{display:flex;gap:10px;align-items:center;background:#f6f9fb;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13.5px}.mov .n{flex:none;background:var(--az);color:#fff;font-weight:900;border-radius:9px;padding:6px 9px}
.pin{margin-left:auto;text-align:center;line-height:1.1}.pin small{display:block;font-size:10.5px;color:var(--suave);font-weight:700}.pin b{font-size:18px;letter-spacing:2px}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.vacio{text-align:center;color:var(--suave);padding:30px 10px}.vacio .e{font-size:44px}
.marc-movil{background:var(--az);color:#fff;border:3px solid #fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
/* historial */
.filtros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,39,64,.08);border-top:4px solid var(--c,var(--az))}.kpi small{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}.kpi b{display:block;font-size:24px;margin-top:2px}
.tabla-w{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(15,39,64,.08)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef2f6;white-space:nowrap}th{background:#f6f9fb;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);position:sticky;top:0}
td.r,th.r{text-align:right}td.w{white-space:normal;min-width:180px}
.chip-e{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef2f6;color:#33475b}.chip-e.fin{background:#e3f6e8;color:#1b6e31}.chip-e.anu{background:#fdecec;color:#9b1c1c}.chip-e.act{background:#fff1e3;color:#8a4300}
/* equipo */
.lista-e .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eef2f6}.lista-e .it:last-child{border-bottom:0}
.lista-e .av{flex:none;width:38px;height:38px;border-radius:50%;background:#eef4fa;color:var(--az);font-weight:800;display:flex;align-items:center;justify-content:center}
.lista-e .tx{flex:1;min-width:0}.lista-e .tx b{display:block}.lista-e .tx small{color:var(--suave);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* modal */
.modal-f{position:fixed;inset:0;z-index:5000;background:rgba(10,25,45,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #eef2f6}.modal .mh h3{margin:0;font-size:17px}.modal .mh button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--suave)}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:10px}.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid #eef2f6}
.info-c{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}.info-c span{color:var(--suave)}
/* móvil */
@media (max-width:860px){
  .top .emp small{display:none}.top img{height:32px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:#fff;border-top:1px solid var(--borde);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .tabs button{flex-direction:column;gap:2px;color:var(--suave);font-size:11.5px;padding:6px 8px}.tabs button.on{background:#eef4fa;color:var(--az)}.tabs button:hover{background:none;color:var(--az)}
  .tabs .badge{position:absolute;top:0;right:4px}
  .cuerpo{flex-direction:column-reverse;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .panel{width:100%;flex:1}.mapa-box{flex:none;height:34vh}
  .filtros{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
}
@media print{.top,.tabs,.filtros,.no-print{display:none!important}.panel{overflow:visible;padding:0}body{background:#fff}}
.cc-sal{border-radius:14px;padding:14px 18px;color:#fff;background:linear-gradient(135deg,#1b6e31,#2f9a4e);display:flex;flex-direction:column;margin:6px 0 12px}.cc-sal.debe{background:linear-gradient(135deg,#9b1c1c,#d0452f)}.cc-sal b{font-size:26px}.cc-sal small,.cc-sal span{opacity:.9;font-size:13px}
#ccE h4{margin:14px 0 6px;font-size:14px}.cc-t{width:100%;border-collapse:collapse;font-size:13.5px}.cc-t th,.cc-t td{padding:6px 6px;border-bottom:1px solid #e3e9ef;text-align:left;vertical-align:top}.cc-t th{color:#5b6b7b;font-weight:600}.cc-t .r{text-align:right}
</style>
</head>
