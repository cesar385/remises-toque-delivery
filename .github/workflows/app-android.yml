# Apps Android de Remises TOQUE! (conductor y pasajero)
# Arma los proyectos desde cero, los compila y publica los APK para descargar:
#   https://github.com/cesar385/remises-toque/releases/latest/download/toque-conductor.apk
#   https://github.com/cesar385/remises-toque/releases/latest/download/toque-pasajero.apk
# Para compilar: pestaña Actions -> "App Android" -> Run workflow.
name: App Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: conductor
            nombre: TOQUE! Conductor
          - app: pasajero
            nombre: TOQUE! Pasajero
    env:
      APP: /home/runner/toque-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Crear el proyecto de la app
        run: |
          mkdir -p "$APP/www" && cd "$APP"
          cat > package.json <<'FIN'
          {
            "name": "toque-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor-community/background-geolocation": "1.2.26",
              "@capacitor/android": "7.6.9",
              "@capacitor/app": "7.1.2",
              "@capacitor/core": "7.6.9",
              "@capacitor/local-notifications": "7.0.7",
              "capacitor-voice-recorder": "7.0.6"
            },
            "devDependencies": {
              "@capacitor/cli": "7.6.9"
            }
          }
          FIN
          cat > capacitor.config.json <<'FIN'
          {
            "appId": "com.remisestoque.${{ matrix.app }}",
            "appName": "${{ matrix.nombre }}",
            "webDir": "www",
            "server": {
              "url": "https://remisestoque.com/${{ matrix.app }}.html",
              "cleartext": false,
              "errorPath": "error.html"
            },
            "android": {
              "useLegacyBridge": true,
              "backgroundColor": "#0e1a2b"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_toque",
                "iconColor": "#5fa52f"
              }
            }
          }
          FIN
          cat > www/index.html <<'FIN'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${{ matrix.nombre }}</title>
          <script>location.replace('https://remisestoque.com/${{ matrix.app }}.html');</script></head><body style="background:#0e1a2b"></body></html>
          FIN
          cat > www/error.html <<'FIN'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sin conexión</title>
          <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#183c62,#215181 60%,#5fa52f);font-family:system-ui,Roboto,Arial,sans-serif;padding:16px}
          .c{background:#fff;border-radius:16px;padding:28px 22px;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}h2{color:#183c62;margin:8px 0}p{color:#5e6f70}
          button{background:#5fa52f;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;margin-top:10px}</style></head>
          <body><div class="c"><div style="font-size:48px">📶</div><h2>Sin conexión</h2><p>No se pudo abrir la app. Revisá los datos móviles o el Wi-Fi y probá de nuevo.</p>
          <button onclick="location.href='https://remisestoque.com/${{ matrix.app }}.html'">Reintentar</button></div>
          <script>setInterval(()=>{ if (navigator.onLine) location.href='https://remisestoque.com/${{ matrix.app }}.html'; }, 8000);</script></body></html>
          FIN
          npm install --no-audit --no-fund
          npx cap add android

      - name: Personalizar (íconos, permisos, firma)
        run: |
          pip install --quiet pillow
          cd "$APP"
          cat > preparar.py <<'FIN'
          # Personaliza el proyecto Android generado por Capacitor: íconos, textos, permisos, firma y batería.
          import os, re, sys
          from PIL import Image, ImageDraw, ImageFont
          raiz = sys.argv[1]            # carpeta del repositorio
          tipo = sys.argv[2]            # conductor o pasajero
          nombre = 'TOQUE! Conductor' if tipo == 'conductor' else 'TOQUE! Pasajero'
          paquete = 'com.remisestoque.' + tipo
          canal = 'En servicio (ubicación)' if tipo == 'conductor' else 'Seguimiento de tu viaje'
          app = 'android/app'
          res = app + '/src/main/res'
          def buscar(*nombres):
              for n in nombres:
                  p = os.path.join(raiz, n)
                  if os.path.exists(p): return p
              sys.exit('No encuentro ' + nombres[0])
          icono = Image.open(buscar(f'img/{tipo}-512.png', f'{tipo}-512.png')).convert('RGBA')
          logo = Image.open(buscar('img/logo-blanco.png', 'logo-blanco.png')).convert('RGBA'); logo = logo.crop(logo.getbbox())
          fondo = '#%02x%02x%02x' % icono.getpixel((10, 10))[:3]
          try: fuente = lambda n: ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', n)
          except Exception: fuente = None
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True); os.makedirs(f'{res}/drawable-{d}', exist_ok=True)
              s = int(48 * k); a = icono.resize((s, s), Image.LANCZOS); a.save(f'{res}/mipmap-{d}/ic_launcher.png')
              m = Image.new('L', (s, s), 0); ImageDraw.Draw(m).ellipse((0, 0, s - 1, s - 1), fill=255); r = a.copy(); r.putalpha(m); r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
              f = int(108 * k); fg = Image.new('RGBA', (f, f), (0, 0, 0, 0)); L = logo.copy(); L.thumbnail((int(f * .62),) * 2, Image.LANCZOS); fg.paste(L, ((f - L.width) // 2, (f - L.height) // 2), L); fg.save(f'{res}/mipmap-{d}/ic_launcher_foreground.png')
              n = int(24 * k); im = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              try: ImageDraw.Draw(im).text((n / 2, n / 2), 'T', fill=(255, 255, 255, 255), font=fuente(int(n * .8)), anchor='mm')
              except Exception: ImageDraw.Draw(im).rectangle((n * .2, n * .2, n * .8, n * .8), fill=(255, 255, 255, 255))
              im.save(f'{res}/drawable-{d}/ic_stat_toque.png')
          for carpeta, _, archivos in os.walk(res):
              for fn in archivos:
                  if fn == 'splash.png':
                      p = os.path.join(carpeta, fn); w, h = Image.open(p).size
                      sp = Image.new('RGBA', (w, h), (14, 26, 43, 255)); L = logo.copy(); L.thumbnail((int(min(w, h) * .55),) * 2, Image.LANCZOS)
                      sp.paste(L, ((w - L.width) // 2, (h - L.height) // 2), L); sp.convert('RGB').save(p)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">{fondo}</color>\n</resources>\n')
          open(f'{res}/values/strings.xml', 'w').write(f'''<?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">{nombre}</string>
              <string name="title_activity_main">{nombre}</string>
              <string name="package_name">{paquete}</string>
              <string name="custom_url_scheme">{paquete}</string>
              <string name="capacitor_background_geolocation_notification_channel_name">{canal}</string>
              <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_toque</string>
              <string name="capacitor_background_geolocation_notification_color">#5fa52f</string>
          </resources>
          ''')
          # permisos
          man = app + '/src/main/AndroidManifest.xml'; s = open(man).read()
          perm = ['ACCESS_NETWORK_STATE', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK', 'VIBRATE']
          if tipo == 'conductor': perm += ['RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          extra = ''.join(f'    <uses-permission android:name="android.permission.{p}" />\n' for p in perm if f'android.permission.{p}"' not in s)
          s = s.replace('</manifest>', extra + '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>')
          open(man, 'w').write(s)
          # versión y firma
          g = app + '/build.gradle'; s = open(g).read()
          s = re.sub(r'versionCode \d+', 'versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())', s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")', s)
          s = s.replace('    buildTypes {', '''    signingConfigs {
                  release {
                      storeFile file("../../toque-conductor.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "toque-conductor"
                      keyAlias "toque"
                      keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "toque-conductor"
                  }
              }
              buildTypes {''', 1)
          s = s.replace('        release {\n            minifyEnabled false', '        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false', 1)
          open(g, 'w').write(s)
          # pantalla principal del conductor: pide quedar sin restricción de batería
          act = app + '/src/main/java/com/remisestoque/conductor/MainActivity.java'
          if tipo == 'conductor': open(act, 'w').write('''package com.remisestoque.conductor;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              i.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          }
                      }
                  } catch (Exception e) { }
              }
          }
          ''')
          print('Proyecto personalizado. Fondo del ícono:', fondo)
          FIN
          python3 preparar.py "$GITHUB_WORKSPACE" ${{ matrix.app }}

      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd "$APP"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > toque-conductor.keystore
          else
            echo "::warning::Falta el secreto KEYSTORE_B64: se usa una firma temporal (para actualizar habrá que desinstalar la app anterior)."
            keytool -genkeypair -keystore toque-conductor.keystore -alias toque -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-toque-conductor}" -keypass "${KEYSTORE_PASSWORD:-toque-conductor}" -dname "CN=Remises TOQUE!, O=Remises TOQUE!, C=AR"
          fi

      - name: Compilar el APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/toque-${{ matrix.app }}.apk"

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: toque-${{ matrix.app }}
          path: toque-${{ matrix.app }}.apk

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publicar para descargar (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android-v${{ github.run_number }}
          name: Apps Android v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Apps Android de Remises TOQUE!
            - toque-conductor.apk: app del conductor (GPS con el celular bloqueado).
            - toque-pasajero.apk: app del pasajero (avisos del viaje con el celular bloqueado).
            Descargá el APK en el celular y abrilo para instalarlo (puede pedir permitir "instalar apps desconocidas").
          files: |
            toque-conductor.apk
            toque-pasajero.apk
