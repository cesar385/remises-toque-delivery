        if (v.estado === 'confirmado' && v.llego) avisarNativo('📍 Tu remís llegó', mv + '\nTe está esperando', 'viaje-' + id, ab);
        else if (v.estado === 'confirmado') avisarNativo('🚕 Tu remís está en camino', mv + '\nTocá para seguirlo en el mapa', 'viaje-' + id, ab);
        else if (v.estado === 'finalizado') avisarNativo('✅ ¡Llegaste!', (v.monto ? 'Total: ' + pesos(v.monto) + '. ' : '') + '¡Gracias por viajar con nosotros!', 'viaje-' + id, ab);
        else if (v.estado === 'anulado') avisarNativo('Viaje cancelado', 'Tu viaje fue cancelado.', 'viaje-' + id, ab);
      }
      st.claveAviso = clave;
      guardiaViaje(['pendiente', 'ofrecido', 'confirmado', 'en_curso'].includes(v.estado));
    }
    if (['pendiente', 'ofrecido'].includes(st.estPrev) && v.estado === 'confirmado') { toast(`Móvil ${v.movil_numero} en camino${v.conductor ? ' · ' + v.conductor : ''}`, 'ok'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch { } }
    st.estPrev = v.estado;
    $('#cont').innerHTML = `<div class="estado-g">${v.estado === 'confirmado' && v.llego ? '📍 Tu remís llegó: te está esperando' : (TXT[v.estado] || v.estado)}</div>
      ${v.movil_numero && !['pendiente', 'ofrecido'].includes(v.estado) ? `<div class="kpi"><div class="l">Tu móvil</div><div class="v">N° ${v.movil_numero} · ${esc(v.patente || '')}</div><div>${esc(v.movil || '')}</div><div>Conductor: ${esc(v.conductor || '')}</div></div>` : ''}
      ${v.pin && ['confirmado', 'ofrecido', 'pendiente'].includes(v.estado) ? `<div class="kpi"><div class="l" style="text-align:center">PIN de seguridad — dáselo al conductor al subir</div><div class="pin">${v.pin}</div></div>` : ''}
      <div>${esc(v.origen)}${v.destino ? `<br>${esc(v.destino)}` : ''}</div>${v.monto ? `<div>${v.estado === 'finalizado' ? 'Total' : 'Estimado'}: <b>${pesos(v.monto)}</b></div>` : ''}
      ${['pendiente', 'ofrecido', 'confirmado', 'reserva'].includes(v.estado) ? '<button class="btn rojo grande" id="canc">Cancelar viaje</button>' : ''}
      ${v.estado === 'finalizado' ? `<p style="text-align:center">¿Cómo fue tu viaje?</p><div class="estrellas">${[1, 2, 3, 4, 5].map(n => `<span data-s="${n}">${n <= (v.calificacion || 0) ? '★' : '☆'}</span>`).join('')}</div>` : ''}
      ${['finalizado', 'anulado'].includes(v.estado) ? '<button class="btn grande" id="nuevo">Pedir otro viaje</button>' : ''}
      <button class="btn sec" id="comp">Compartir seguimiento</button>
      ${S.cli ? '<button class="btn sec" id="misv">Ver mis viajes</button>' : ''}`;
    if ($('#canc')) $('#canc').onclick = async () => { if (confirm('¿Cancelar el viaje?')) { try { await api(`/api/pub/viaje/${id}/cancelar?k=${k}`, {}); } catch (e) { toast(e.message, 'error'); } ult = null; pintar(); } };
    if ($('#nuevo')) $('#nuevo').onclick = () => { LS.del('rodar_viaje'); history.replaceState({}, '', location.pathname); ir('pedir'); };
    if ($('#misv')) $('#misv').onclick = () => { history.replaceState({}, '', location.pathname); ir('viajes'); };
    $$('[data-s]').forEach(s => s.onclick = async () => { await api(`/api/pub/viaje/${id}/calificar?k=${k}`, { estrellas: +s.dataset.s }); toast('¡Gracias!', 'ok'); ult = null; pintar(); });
    $('#comp').onclick = () => { const u = location.href.split('#')[0] + `#/seguimiento/${id}?k=${k}`; navigator.share ? navigator.share({ title: 'Mi viaje', url: u }).catch(() => { }) : (navigator.clipboard.writeText(u), toast('Enlace copiado')); };
    limpiarMapa();
    if (v.origen_lat) st.mo = L.marker([v.origen_lat, v.origen_lng], { icon: icono('#2f9e57') }).addTo(mapa);
    if (v.destino_lat) st.md = L.marker([v.destino_lat, v.destino_lng], { icon: icono('#2a86e8') }).addTo(mapa);
    if (v.lat && ['confirmado', 'en_curso'].includes(v.estado)) { st.mm = L.marker([v.lat, v.lng], { icon: L.divIcon({ className: '', html: `<div class="marcador-movil" style="background:#5fa52f">${v.movil_numero}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(mapa); mapa.fitBounds(L.latLngBounds([[v.lat, v.lng], [v.origen_lat, v.origen_lng]]).pad(.4)); }
    else if (v.origen_lat) mapa.setView([v.origen_lat, v.origen_lng], 15);
    if (['finalizado', 'anulado'].includes(v.estado)) LS.del('rodar_viaje');
  }
  const primero = await api(`/api/pub/viaje/${id}?k=${k}`).catch(() => null);
  if (primero && primero.canal) { S.socket = RODAR.tiempoReal(primero.canal, ['']); S.socket.on('viaje', v => { ult = null; pintar(v); }); }
  S.timers.push(setInterval(() => pintar(), 5000));
  pintar(primero);
}
function limpiarMapa() { ['mo', 'md', 'mm'].forEach(k => { st[k] && st[k].remove(); st[k] = null; }); }

// ---------- MIS VIAJES ----------
const ETQ = { pendiente: ['Buscando móvil', 'nar'], ofrecido: ['Buscando móvil', 'nar'], confirmado: ['Móvil en camino', 'azul'], en_curso: ['En viaje', 'azul'], reserva: ['Reservado', 'verde'], finalizado: ['Finalizado', ''], anulado: ['Cancelado', 'rojo'] };
async function misViajes() {
  mostrarMapa(false);

  const tarjeta = v => { const [et, cl] = ETQ[v.estado] || [v.estado, ''];
    return `<div class="tarjeta"><div class="fila1"><b>${esc(fecha(v.estado === 'reserva' ? v.programado : v.creado))}</b><span class="tag ${cl}">${et}</span></div>
      <div class="vjr"><div><i class="o"></i>${esc(v.origen_dir)}</div>${v.destino_dir ? `<div><i class="d"></i>${esc(v.destino_dir)}</div>` : ''}</div>
      ${['confirmado', 'en_curso'].includes(v.estado) && v.movil_numero ? `<div class="kpi" style="margin:6px 0"><div class="l">Tu móvil</div><div class="v">N° ${v.movil_numero} · ${esc(v.patente || '')}</div><div>${esc([v.movil, v.movil_color].filter(Boolean).join(' '))}</div>${v.conductor ? `<div>Conductor: ${esc(v.conductor)}</div>` : ''}</div>` : ''}
      <div class="fila1"><small style="color:var(--suave)">${v.movil_numero ? `Móvil ${v.movil_numero}${v.movil ? ' · ' + esc(v.movil) : ''}` : ''}${v.km ? ` · ${km1(v.km)} km` : ''}${v.estado === 'finalizado' && v.calificacion ? ' · ' + '★'.repeat(v.calificacion) : ''}${v.estado === 'anulado' && v.motivo_anulacion ? esc(v.motivo_anulacion) : ''}</small>
        ${v.monto != null && v.estado !== 'anulado' ? `<span class="monto">${v.monto_final ? '' : '~'}${pesos(v.monto)}</span>` : ''}</div>
      <div class="acc">${['pendiente', 'ofrecido', 'confirmado', 'en_curso'].includes(v.estado) ? `<button class="btn chico" data-ver="${v.id}">Ver en el mapa</button>` : ''}
        ${v.estado === 'reserva' ? `<button class="btn rojo chico" data-canc="${v.id}">Cancelar reserva</button>` : ''}
        ${v.estado === 'finalizado' ? `<button class="btn sec chico" data-comp="${v.id}">Comprobante</button>${v.calificacion ? '' : `<button class="btn sec chico" data-ver="${v.id}">★ Calificar</button>`}` : ''}
        ${['finalizado', 'anulado'].includes(v.estado) ? `<button class="btn sec chico" data-rep="${v.id}">↻ Repetir</button>` : ''}</div></div>`; };
  $('#cont').innerHTML = `<h2 class="tit">Mis viajes</h2>
    ${act.length ? `<div class="paso">Ahora</div>${act.map(tarjeta).join('')}` : ''}
    <div class="paso">Reservas</div>${res.length ? res.map(tarjeta).join('') : '<div class="vacio" style="padding:6px">No tenés reservas. Podés programar un viaje desde <a href="#" id="irPedir">Pedir</a> → Programar.</div>'}
    <div class="paso">Historial</div>${hist.length ? hist.map(tarjeta).join('') : '<div class="vacio" style="padding:6px">Todavía no hiciste viajes con tu cuenta.</div>'}`;
  const de = id => vs.find(v => v.id === +id);
  if ($('#irPedir')) $('#irPedir').onclick = e => { e.preventDefault(); ir('pedir'); };
  $$('[data-ver]').forEach(b => b.onclick = () => { const v = de(b.dataset.ver); ir('seguir', v.id, v.k); });
  $$('[data-canc]').forEach(b => b.onclick = async () => { if (!confirm('¿Cancelar esta reserva?')) return; try { await api(`/api/cli/viajes/${b.dataset.canc}/cancelar`, {}); toast('Reserva cancelada', 'ok'); misViajes(); } catch (e) { toast(e.message, 'error'); } });
  $$('[data-rep]').forEach(b => b.onclick = () => { const v = de(b.dataset.rep); ir('pedir', { o: { lat: v.origen_lat, lng: v.origen_lng, dir: v.origen_dir, ref: v.origen_ref }, d: v.destino_lat ? { lat: v.destino_lat, lng: v.destino_lng, dir: v.destino_dir } : null }); });
  $$('[data-comp]').forEach(b => b.onclick = () => comprobante(de(b.dataset.comp)));
}
function comprobante(v) {
  const w = window.open('', '_blank'); if (!w) return toast('Permití las ventanas emergentes para ver el comprobante', 'error');

  const d = document.createElement('div'); d.className = 'modal-fondo';
  const tel = S.cli ? S.cli.telefono : (LS.get('rodar_tel') || '');
  d.innerHTML = `<div class="modal"><div class="mh"><h3>Ayuda</h3><button>×</button></div><div class="mb"><p>¿Tuviste un problema? Escribinos y te respondemos.${st.cfg.telefono ? ` También podés llamar al <a href="tel:${esc(st.cfg.telefono)}">${esc(st.cfg.telefono)}</a>.` : ''}</p>${waAyuda()}<p><a href="ayuda.html?tipo=Reclamo">⚠️ Hacer un reclamo</a> · <a href="manual-pasajero.html" target="_blank">📘 Manual de uso</a></p><div class="campo"><label>Celular</label><input id="at" value="${esc(tel)}"></div><div class="campo"><label>Mensaje</label><textarea id="am"></textarea></div></div><div class="mf"><button class="btn">Enviar</button></div></div>`;
  document.body.append(d); $('.mh button', d).onclick = () => d.remove();
  $('.mf button', d).onclick = async () => { try { await api('/api/pub/soporte', { telefono: $('#at', d).value, alias: S.cli ? S.cli.nombre : LS.get('rodar_nombre'), texto: $('#am', d).value }); toast('Mensaje enviado', 'ok'); d.remove(); } catch (e) { toast(e.message, 'error'); } };
};
function ingresoEmpresas() { ir('empresas'); }
// Ingreso para empresas con cuenta corriente: pantalla aparte del ingreso de pasajeros (también se llega con pasajero.html#/empresas).
function pantallaEmpresas() {
  mostrarMapa(false);
  const corp = JSON.parse(LS.get('rodar_corp') || 'null');
  const enLogin = !S.cli && !corp, envol = h => enLogin ? marcoLogin(h) : h;
  $('#cont').innerHTML = envol(`<div style="text-align:center"><a href="index.html" title="Ir a la página principal"><img src="img/logo.png" alt="Remises TOQUE!" style="width:${enLogin ? 220 : 190}px;max-width:80%"></a></div>
    ${enLogin ? '<div class="rol-etiqueta rol-empresa">🏢 Empresas</div>' : ''}
    ${S.cli || corp ? '' : `<div class="tipo-ing"><button type="button" id="tPas"><span>🙂</span>Soy pasajero</button><button type="button" class="emp on"><span>🏢</span>Soy empresa</button></div>`}
    <div class="caja-empresa">${enLogin ? '' : '<h3 style="margin:0 0 6px;color:#1f4e79">🏢 Ingreso para empresas</h3>'}
      ${corp ? `<div class="nota">Ingresaste como <b>${esc(corp.nombre)}</b>. Los viajes que pidas quedan a cuenta de la empresa.</div><button class="btn grande" id="pedirEmp" style="background:#1f4e79">Pedir un viaje para la empresa</button><button class="btn sec" id="xc2" style="margin-top:8px;width:100%">Salir de la cuenta de empresa</button>` : `
      <ul class="ventajas"><li>Los viajes quedan <b>a cuenta corriente</b>: no se pagan en el momento.</li><li>Pedís para cualquier persona de tu equipo indicando su nombre y celular.</li><li>La central te envía el resumen de viajes para facturar.</li></ul>
      <p style="margin:0 0 10px;font-size:14px">Ingresá con el <b>usuario de empresa</b> que te dio la central (no es tu cuenta de pasajero).</p>
      <form id="fe" style="display:flex;flex-direction:column;gap:10px" autocomplete="on">
        <div class="campo"><label>Usuario de la empresa</label><input name="usuario" autocomplete="username" autocapitalize="none" required></div>
        <div class="campo"><label>Contraseña</label><div class="pass"><input name="password" id="pwe" type="password" autocomplete="current-password" required><button type="button" id="vere">👁</button></div></div>
        <div class="err" id="erre"></div>
        <button class="btn grande" id="oke" style="background:#1f4e79">Ingresar como empresa</button>
      </form>
      <p style="font-size:13px;color:var(--suave);margin:12px 0 0;text-align:center">¿Tu empresa todavía no tiene cuenta corriente? ${st.cfg.telefono ? `Llamá al <a href="tel:${esc(st.cfg.telefono)}">${esc(st.cfg.telefono)}</a> o tocá <b>Ayuda</b>` : 'Tocá <b>Ayuda</b> arriba'} y pedila.</p>`}</div>
    <div class="otros-ingresos"><span>Otros ingresos</span><a href="conductor.html">🚕 Soy conductor</a><a href="#" id="ayuda3">💬 Ayuda</a><a href="index.html">🏠 Página principal</a></div>`);
  $('#ayuda3').onclick = e => { e.preventDefault(); $('#ayuda').click(); };
  if ($('#tPas')) $('#tPas').onclick = () => ir('ingresar');
  if ($('#pedirEmp')) $('#pedirEmp').onclick = () => ir('pedir');
  if ($('#xc2')) $('#xc2').onclick = e => { e.preventDefault(); LS.del('rodar_corp'); ir(S.cli ? 'pedir' : 'empresas'); };
  if (!$('#fe')) return;
  $('#vere').onclick = () => { const x = $('#pwe'); x.type = x.type === 'password' ? 'text' : 'password'; };
  $('#fe').onsubmit = async e => {
    e.preventDefault(); const er = $('#erre'); er.textContent = ''; const btn = $('#oke'); btn.disabled = true;
    try {
      const r = await RODAR.llamar('/api/login', 'POST', { usuario: e.target.usuario.value.trim(), password: e.target.password.value, tipo: 'web' }, null);
      if (!r.usuario.roles.includes('corporativo')) throw new Error('Este usuario no es de una empresa. Si sos pasajero, ingresá desde Ingresar.');
      LS.set('rodar_corp', JSON.stringify({ token: r.token, nombre: r.usuario.nombre + ' ' + r.usuario.apellido }));
      ir('pedir');
    } catch (x) { er.textContent = x.message; btn.disabled = false; }
  };
}
botonInstalar(document.getElementById('inst'), '', 'Instalar');
if (!RODAR.listo) document.getElementById('cont').innerHTML = '<p>Falta configurar config.js con los datos de Supabase (ver README).</p>'; else arrancar();
</script>
</body>
