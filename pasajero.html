async function arrancar() {

  mapa = L.map('mapa', { dobleClicAcerca: true }).setView([st.cfg.lat, st.cfg.lng], 14);
  capaBase(mapa);
  if (S.tk) { try { S.cli = await api('/api/cli/perfil'); } catch { S.cli = null; } }
  if (S.cli) await revisarTyc();
  nativoIniciar(); activarPush(false);
  { const qs = new URLSearchParams(location.search); // vuelta de Mercado Pago: ?viaje=ID&k=…&pago=ok|pendiente|error
    if (qs.get('viaje') && qs.get('k')) history.replaceState({}, '', location.pathname + `#/seguimiento/${+qs.get('viaje')}?k=${encodeURIComponent(qs.get('k'))}${qs.get('pago') ? '&pago=' + encodeURIComponent(qs.get('pago')) : ''}`); }

  if (location.hash === '#ayuda') { history.replaceState({}, '', location.pathname); setTimeout(() => abrirAyuda(), 400); } // volvió de los Términos abiertos desde Ayuda

// ---------- lugares (invitado: en este celular; con cuenta: en el servidor) ----------
const lugaresLocales = () => { try { return JSON.parse(LS.get('rodar_lugares') || '[]'); } catch { return []; } };
function recordarLugar(x) {
  if (!x || !x.dir || x.lat == null) return;
  const l = lugaresLocales().filter(y => y.dir !== x.dir); l.unshift({ dir: x.dir, lat: x.lat, lng: x.lng, loc: x.loc, prov: x.prov });
  LS.set('rodar_lugares', JSON.stringify(l.slice(0, 6)));
}
function listaChips() {
  if (S.cli) {
    const favs = (S.cli.lugares || []).map(l => ({ fav: 1, et: l.etiqueta, dir: l.direccion, lat: l.lat, lng: l.lng, loc: l.localidad, prov: l.provincia, ref: l.referencias }));
    const rec = (S.cli.recientes || []).filter(r => !favs.some(f => f.dir === r.direccion)).map(r => ({ id: r.id, dir: r.direccion, lat: r.lat, lng: r.lng, loc: r.localidad, prov: r.provincia }));
    return [...favs, ...rec].slice(0, 10);
  }
  return lugaresLocales();
}
function chips(c, l) {
  if (!l.length) return '';
  // Los recientes se pueden quitar con la ×; los guardados (Casa, Trabajo…) se administran en Lugares
  return `<div class="chips">${l.map((x, i) => x.fav ? `<button type="button" class="fav" data-l="${c}${i}" title="${esc(x.dir)}">${esc(x.et)}</button>`
    : `<span class="chip-r"><button type="button" data-l="${c}${i}" title="${esc(x.dir)}">${esc(x.dir)}</button><button type="button" class="chip-x" data-lx="${i}" aria-label="Quitar ${esc(x.dir)} de recientes" title="Quitar de recientes">×</button></span>`).join('')}</div>`;
}
function ubicar(silencio) {
  if (!navigator.geolocation) { if (!silencio) toast('Tu celular no comparte la ubicación con el navegador', 'error'); return; }
  if ($('#ubic')) $('#ubic').textContent = 'Buscando dónde estás…';
  navigator.geolocation.getCurrentPosition(p => { if ($('#ubic')) $('#ubic').textContent = ''; if (S.vista === 'pedir' && (!st.o || !silencio)) { S.noFoco = silencio; fijar('o', p.coords.latitude, p.coords.longitude).finally(() => { S.noFoco = false; }); } },
    () => { if ($('#ubic')) $('#ubic').textContent = 'No pudimos saber dónde estás: escribí la dirección o tocá el mapa.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

async function guardarFavorito(x, ref) {

  catch (e) { toast(e.message, 'error'); }

function aviso(c, t) { const el = $(c === 'o' ? '#ubic' : '#ubicD'); if (el) el.textContent = t; }

  const inp = $(c === 'o' ? '#od' : '#dd'); if (!inp) return; { const lo = $('#' + (c === 'o' ? 'ol' : 'dl')), pr = $('#' + (c === 'o' ? 'op' : 'dp')); if (lo && d.localidad) lo.value = d.localidad; if (pr && d.provincia) pr.value = d.provincia; st[c].loc = (lo && lo.value) || d.localidad; st[c].prov = (pr && pr.value) || d.provincia; inp.value = RODAR.compDir(d.direccion, (lo && lo.value) || d.localidad, (pr && pr.value) || d.provincia); }
  { const l = $('#' + c + 'l'), pr = $('#' + c + 'p'); if (l && d.localidad) l.value = d.localidad; if (pr && d.provincia) pr.value = d.provincia; }
  const fb = $(c === 'o' ? '#favO' : '#favD'); if (fb) fb.classList.remove('oculto');
  const k = c === 'o' ? 'mo' : 'md';
  st[k] && st[k].remove(); st[k] = L.marker([lat, lng], { icon: icono(c === 'o' ? '#278449' : '#2a86e8'), draggable: true }).addTo(mapa);
  st[k].on('dragend', e => { const p = e.target.getLatLng(), txt = inp.value.trim();
    if (RODAR.partirDir(txt).altura) { st[c].lat = p.lat; st[c].lng = p.lng; st[c].dir = RODAR.enTexto(txt).dir; aviso(c, 'Ubicación corregida.'); estimar(); } else fijar(c, p.lat, p.lng); });
  if (d.sinAltura) { const pos = d.direccion.length + 1; inp.value = d.direccion + ' ' + inp.value.slice(d.direccion.length); aviso(c, ''); if (!S.noFoco) { inp.focus(); inp.setSelectionRange(pos, pos); } }
  else if (d.aprox) aviso(c, d.conocida === 'estimada' ? 'Ubicación estimada. Si no es tu puerta, arrastrá el pin.' : 'Ubicación aproximada: arrastrá el pin hasta tu puerta.');
  else aviso(c, '');
  if (st.o && st.d) mapa.fitBounds(L.latLngBounds([[st.o.lat, st.o.lng], [st.d.lat, st.d.lng]]).pad(.3)); else mapa.setView([lat, lng], 16);
  estimar();
}
function lugarDe(c) { const l = ($('#' + c + 'l') || {}).value, p = ($('#' + c + 'p') || {}).value; return [l, p].map(x => (x || '').trim()).filter(Boolean).join(', '); }
function auto(inp, sug, alElegir, c) {

let estN = 0;
async function estimar() {
  if (!st.o || !$('#est')) return;
  const n = ++estN;
  // Ruta por calles entre origen y destino: se dibuja en el mapa y su distancia mejora el precio estimado
  let rt = null; if (st.d) rt = await RODAR.ruta(st.o, st.d);
  if (n !== estN) return;
  st.ruta && st.ruta.remove(); st.ruta = null; st.rutaM = rt ? rt.metros : null;
  if (st.d) {
    st.ruta = L.polyline(rt ? rt.coords : [[st.o.lat, st.o.lng], [st.d.lat, st.d.lng]], rt ? { color: '#1d6fe0', weight: 5, opacity: .8 } : { color: '#555', weight: 3, dashArray: '6' }).addTo(mapa);
    mapa.fitBounds(st.ruta.getBounds().pad(.15));
  }
  const r = await api('/api/pub/estimar', { origen_lat: st.o.lat, origen_lng: st.o.lng, destino_lat: st.d && st.d.lat, destino_lng: st.d && st.d.lng, medio_pago: $('#mp') && $('#mp').value, metros_ruta: st.rutaM }).catch(() => null);
  st.estimado = r && r.monto != null ? +r.monto : null;
  if (!r || !$('#est')) return;
  $('#est').textContent = r.monto != null ? pesos(r.monto) : 'Desde ' + pesos(r.bajada);

// ---------- Pago del viaje con Mercado Pago (va directo a la cuenta del conductor si la vinculó) ----------
async function cobroMp(id, k, v, soloPintar) {
  st.mp = st.mp || {};
  const pago = new URLSearchParams(location.hash.split('?')[1] || '').get('pago');
  if (pago) { // volvimos de Mercado Pago
    history.replaceState({}, '', `#/seguimiento/${id}?k=${k}`);
    st.mpRet = pago; st.mpRetT = Date.now();
    if (pago === 'ok') toast('✔ Pago aprobado. ¡Gracias!', 'ok'); else if (pago === 'error') toast('El pago no se completó', 'error');
  }
  if (!soloPintar && (!st.mp[id] || (!st.mp[id].pagado && Date.now() - (st.mp[id].t || 0) > 8000))) {
    try { st.mp[id] = { ...(await api(`/api/pub/viaje/${id}/mp?k=${k}`)), t: Date.now() }; } catch { st.mp[id] = { habilitado: false, t: Date.now() }; }
  }
  const e = st.mp[id] || {}, c = $('#mpPago'); if (!c) return;
  if (e.pagado) { c.innerHTML = `<div class="mp-card ok"><b>✔ Pago recibido</b><span>Pagaste ${pesos(e.monto || (v && v.monto))} con Mercado Pago. ¡Gracias por viajar con nosotros!</span></div>`; return; }
  if (st.mpRet && Date.now() - (st.mpRetT || 0) > 120000) st.mpRet = null; // si no se confirmó en 2 min, vuelve a ofrecer el pago
  if (st.mpRet === 'ok' || st.mpRet === 'pendiente') { c.innerHTML = `<div class="mp-card"><b>⏳ Procesando el pago…</b><span>Mercado Pago está acreditando el pago. En unos segundos se confirma acá.</span></div>`; setTimeout(() => { if (st.mp[id]) st.mp[id].t = 0; cobroMp(id, k, v); }, 5000); return; }
  if (!e.habilitado) { c.innerHTML = ''; return; }
  if (st.mpEfectivo === id) { c.innerHTML = `<div class="mp-card"><b>💵 Pago en efectivo</b><span>Abonale ${pesos(e.monto)} a tu conductor.</span><a href="#" id="mpOtra">Prefiero pagar con Mercado Pago</a></div>`; $('#mpOtra').onclick = ev => { ev.preventDefault(); st.mpEfectivo = null; cobroMp(id, k, v, true); }; return; }
  c.innerHTML = `<div class="mp-card"><div class="mp-tot"><span>Total del viaje</span><b>${pesos(e.monto)}</b></div>${v && +v.cargo_plataforma > 0 ? `<small style="display:block;margin:-4px 0 8px;color:#627280">Incluye ${pesos(v.cargo_plataforma)} de cargos de la plataforma</small>` : ''}
    <button class="btn grande mp-btn" id="mpPagar">Pagar con Mercado Pago</button>
    <button class="btn sec" id="mpEfec">Le pago en efectivo al conductor</button>
    ${e.directo ? '<small>El pago va directo a la cuenta de tu conductor.</small>' : '<small>Pago seguro con Mercado Pago.</small>'}</div>`;
  $('#mpEfec').onclick = () => { st.mpEfectivo = id; cobroMp(id, k, v, true); };
  $('#mpPagar').onclick = async () => {
    const b = $('#mpPagar'); b.disabled = true; b.textContent = 'Abriendo Mercado Pago…';
    try {
      const C = window.RODAR_CONFIG || {}, r = await fetch(C.supabaseUrl.replace(/\/$/, '') + '/functions/v1/mp-pagar', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.supabaseKey, Authorization: 'Bearer ' + C.supabaseKey }, body: JSON.stringify({ id, k }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.error) throw new Error(d.error || 'No se pudo abrir Mercado Pago');
      if (d.ya_pagado) { st.mp[id] = { ...e, pagado: true }; return cobroMp(id, k, v, true); }
      location.href = d.init_point;
    } catch (er) { b.disabled = false; b.textContent = 'Pagar con Mercado Pago'; toast(er.message, 'error'); }
  };
}

async function revisarTyc() {

        <button class="btn grande" id="ayEnv">Enviar ${v === 'reclamo' ? 'reclamo' : 'a la central'}</button>
        <p class="ay-nota">${v === 'reclamo' ? 'Revisamos cada reclamo con el registro del viaje y te respondemos a la brevedad.' : 'Te respondemos por WhatsApp o llamada al celular que indiques.'}</p>
      </form>`);
    const f = $('.ay-f', ov), err = m => { const e = $('#ayErr', ov); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; };
    $$('#ayM button', ov).forEach(b => b.onclick = () => { motivo = b.dataset.m; $$('#ayM button', ov).forEach(x => x.classList.toggle('on', x === b)); });
    if (arg && arg.motivo) { const b = $$('#ayM button', ov).find(x => x.dataset.m.includes(arg.motivo)); b && b.click(); }
    if (T.viaje && S.cli) {
      try { viajes = (await api('/api/cli/viajes?limite=15')).filter(x => ['finalizado', 'anulado'].includes(x.estado)).slice(0, 8); } catch { viajes = []; }
      const box = $('#ayV', ov); if (!box) return;
      box.innerHTML = viajes.map(x => `<button type="button" data-id="${x.id}"><b>${esc(fecha(x.creado))}</b><span>${esc(x.origen_dir || '')}${x.destino_dir ? ' → ' + esc(x.destino_dir) : ''}</span><small>${x.movil_numero ? 'Móvil ' + x.movil_numero + ' · ' : ''}${x.monto != null ? pesos(x.monto) : ''}</small></button>`).join('')
        + `<button type="button" data-id="0"><b>Otro viaje</b><span>No está en la lista</span></button>`;
      $$('button', box).forEach(b => b.onclick = () => { viaje = +b.dataset.id ? viajes.find(x => x.id === +b.dataset.id) : { otro: true }; $$('button', box).forEach(x => x.classList.toggle('on', x === b)); });
      if (arg && arg.viaje) { const b = $(`button[data-id="${arg.viaje}"]`, box); b && b.click(); }
    }
    f.onsubmit = async e => {
      e.preventDefault(); err('');
      const d = Object.fromEntries([...new FormData(f)].map(([k, x]) => [k, String(x).trim()])), t = d.telefono.replace(/\D/g, '');
      if (!motivo) return err('Elegí una opción: ' + T.pre.toLowerCase());
      if (T.viaje && S.cli && !viaje) return err('Elegí el viaje (o "Otro viaje")');
      if (d.texto.length < 5) return err('Contanos un poco más en el mensaje');
      if (!d.nombre) return err('Escribí tu nombre');
      if (t.length < 8) return err('Escribí un celular válido, con código de área');
      const etq = v === 'mensaje' ? motivo.replace(/^\S+\s/, '') : T.etq;
      const extra = [];
      if (v !== 'mensaje') extra.push('Motivo: ' + motivo.replace(/^\S+\s/, ''));
      if (viaje && !viaje.otro) extra.push(`Viaje #${viaje.id} · ${String(viaje.creado || '').replace('T', ' ').slice(0, 16)} · ${viaje.origen_dir || ''}${viaje.destino_dir ? ' → ' + viaje.destino_dir : ''}${viaje.movil_numero ? ' · Móvil ' + viaje.movil_numero : ''}${viaje.monto != null ? ' · $' + viaje.monto : ''}`);
      if (d.fecha) extra.push('Fecha del viaje: ' + d.fecha.replace('T', ' ')); if (d.movil) extra.push('Móvil/patente: ' + d.movil);
      if (S.cli && S.cli.email) extra.push('Email: ' + S.cli.email);
      const texto = `[${etq}] ${d.texto}${extra.length ? '\n\n' + extra.join('\n') : ''}`;
      const b = $('#ayEnv', ov); b.disabled = true; b.textContent = 'Enviando…';
      try { await api('/api/pub/soporte', { telefono: t, alias: d.nombre, texto }); ir2('ok', { etq, tel: d.telefono }); }
      catch (x) { err(x.message); b.disabled = false; b.textContent = 'Enviar'; }
    };
  }
  ir2(vista || 'inicio', arg);
}
function ingresoEmpresas() { ir('empresas'); }
// Ingreso para empresas con cuenta corriente: pantalla aparte del ingreso de pasajeros (también se llega con pasajero.html#/empresas).
// "Mi empresa": saldo de la cuenta corriente, viajes del mes (en curso, reservas e historial) y tickets
const APK_EMP = 'https://remisestoque.com/apk/toque-empresa.apk';
async function empViajesCC(corp, mes = 0) {
  const box = $('#empCC'); if (!box) return;
  const call = u => RODAR.llamar(u, 'GET', null, corp.token);
  const d0 = new Date(), a = new Date(d0.getFullYear(), d0.getMonth() + mes, 1, 12), z = mes ? new Date(d0.getFullYear(), d0.getMonth() + mes + 1, 0, 12) : d0;
  const iso = x => new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  let vs, cta;
  try { [vs, cta] = await Promise.all([call('/api/emp/viajes?' + new URLSearchParams({ desde: iso(a), hasta: iso(z) })), call('/api/emp/cuenta').catch(() => null)]); }
  catch (e) { if (S.vista === 'empresas' && $('#empCC')) box.innerHTML = `<div class="vacio">${esc(e.message)}${/sesi/i.test(e.message) ? ' Volvé a ingresar como empresa.' : ''}</div>`; return; }
  if (S.vista !== 'empresas' || !$('#empCC')) return;
  const filas = vs.filas || [], act = filas.filter(v => !['finalizado', 'anulado'].includes(v.estado)), hist = filas.filter(v => ['finalizado', 'anulado'].includes(v.estado));
  const t = vs.totales || {}, nomMes = a.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  const tarjeta = v => { const [et, cl] = ETQ[v.estado] || [v.estado, ''];
    return `<div class="tarjeta"><div class="fila1"><b>${esc(fecha(v.estado === 'reserva' ? v.programado : v.creado))}</b><span class="tag ${cl}">${et}</span></div>
      <div><b>${esc(v.pasajero || '')}</b>${v.centro_costo ? ` <small style="color:var(--suave)">· 🏷 ${esc(v.centro_costo)}</small>` : ''}</div>
      <div class="vjr"><div><i class="o"></i>${esc(v.origen_dir || '')}</div>${v.destino_dir ? `<div><i class="d"></i>${esc(v.destino_dir)}</div>` : ''}</div>
      <div class="fila1"><small style="color:var(--suave)">${v.movil_numero && !['pendiente', 'ofrecido', 'reserva'].includes(v.estado) ? `Móvil ${v.movil_numero}${v.movil ? ' · ' + esc(v.movil) : ''}` : ''}${v.km ? ` · ${km1(v.km)} km` : ''}${v.estado === 'anulado' && v.motivo_anulacion ? esc(v.motivo_anulacion) : ''}</small>
        ${v.monto != null && v.estado !== 'anulado' ? `<span class="monto">${v.monto_final ? '' : '~'}${pesos(v.monto)}</span>` : ''}</div>
      ${v.estado === 'finalizado' ? `<div class="acc"><button class="btn sec chico" data-etk="${v.id}">🧾 Ticket</button></div>` : ''}</div>`; };
  box.innerHTML = `${cta ? `<div class="caja-empresa" style="margin-top:12px;text-align:center"><small style="color:var(--suave)">Saldo de la cuenta corriente</small>
      <div style="font-size:28px;font-weight:900;color:${+cta.saldo > 0 ? '#b42323' : '#1b6e31'}">${pesos(Math.abs(+cta.saldo || 0))}</div><small>${+cta.saldo > 0 ? 'a pagar a la central' : +cta.saldo < 0 ? 'a favor de la empresa' : 'al día'}</small></div>` : ''}
    <h3 style="margin:16px 0 4px;color:#1f4e79">🧾 Viajes a cuenta corriente</h3>
    <div class="fila" style="gap:6px;margin-bottom:6px"><button class="btn ${mes ? 'sec' : ''} chico" data-emes="0">Este mes</button><button class="btn ${mes ? '' : 'sec'} chico" data-emes="-1">Mes anterior</button></div>
    <div class="sub" style="margin:0 0 8px">${esc(nomMes.charAt(0).toUpperCase() + nomMes.slice(1))}: <b>${t.viajes || 0}</b> viaje(s) realizados · <b>${pesos(t.monto || 0)}</b></div>
    ${act.length ? `<div class="paso">En curso y reservas</div>${act.map(tarjeta).join('')}` : ''}
    <div class="paso">Realizados</div>${hist.length ? hist.map(tarjeta).join('') : '<div class="vacio" style="padding:6px">No hay viajes realizados en este período.</div>'}`;
  $$('[data-emes]', box).forEach(b => b.onclick = () => { box.innerHTML = '<div class="vacio">Cargando…</div>'; empViajesCC(corp, +b.dataset.emes); });
  $$('[data-etk]', box).forEach(b => b.onclick = () => { const v = filas.find(x => x.id === +b.dataset.etk); if (!v) return; const c = st.cfg || {};
    abrirComprobante({ ...v, movil_patente: v.patente }, { numero: false, cliente: v.pasajero || '', empresa: { nombre: c.nombre, localidad: c.localidad, telefono: c.telefono } }); });
}
function pantallaEmpresas() {
  mostrarMapa(false);
  const corp = JSON.parse(LS.get('rodar_corp') || 'null');
  if (!corp) { location.href = 'empresa.html'; return; } // el ingreso de empresas está en su propia app
  const enLogin = !S.cli && !corp, envol = h => enLogin ? marcoLogin(h) : h;
  $('#cont').innerHTML = envol(`<div style="text-align:center"><a href="index.html" title="Ir a la página principal"><img src="img/logo.png" alt="Remises TOQUE!" style="width:${enLogin ? 220 : 190}px;max-width:80%"></a></div>
    ${enLogin ? '<div class="rol-etiqueta rol-empresa">🏢 Empresas</div>' : ''}
    <a class="btn grande" href="empresa.html" style="background:#1f4e79;margin-bottom:10px;text-decoration:none;display:flex;justify-content:center">🏢 Abrir la app para empresas</a>
    ${!NATIVO && !/iphone|ipad|ipod/i.test(navigator.userAgent) ? `<a class="btn sec" href="${APK_EMP}" style="margin-bottom:10px;text-decoration:none;display:flex;justify-content:center;gap:6px;white-space:normal;text-align:center">📲 Descargar app de empresas · Android</a>` : ''}
    <p style="margin:-4px 0 12px;text-align:center;font-size:13px;color:var(--suave)">Nueva: pedí y reservá para tu equipo, seguí los viajes en el mapa y descargá el resumen mensual.</p>
    <div class="caja-empresa">${enLogin ? '' : '<h3 style="margin:0 0 6px;color:#1f4e79">🏢 Ingreso para empresas</h3>'}
      ${corp ? `<div class="nota">Ingresaste como <b>${esc(corp.nombre)}</b>. Los viajes que pidas quedan a cuenta de la empresa.</div><button class="btn grande" id="pedirEmp" style="background:#1f4e79">Pedir un viaje para la empresa</button><button class="btn sec" id="xc2" style="margin-top:8px;width:100%">Salir de la cuenta de empresa</button></div><div id="empCC"><div class="vacio">Cargando viajes de cuenta corriente…</div>` : `
      <ul class="ventajas"><li>Los viajes quedan <b>a cuenta corriente</b>: no se pagan en el momento.</li><li>Pedís para cualquier persona de tu equipo indicando su nombre y celular.</li><li>La central te envía el resumen de viajes para facturar.</li></ul>
      <p style="margin:0 0 10px;font-size:14px">Ingresá con el <b>usuario de empresa</b> que te dio la central (no es tu cuenta de pasajero).</p>
      <form id="fe" style="display:flex;flex-direction:column;gap:10px" autocomplete="on">
        <div class="campo"><label>Usuario de la empresa</label><input name="usuario" autocomplete="username" autocapitalize="none" required></div>
        <div class="campo"><label>Contraseña</label><div class="pass"><input name="password" id="pwe" type="password" autocomplete="current-password" required><button type="button" id="vere">👁</button></div></div>
        <div class="err" id="erre"></div>
        <button class="btn grande" id="oke" style="background:#1f4e79">Ingresar como empresa</button>
      </form>
      <p style="font-size:13px;color:var(--suave);margin:12px 0 0;text-align:center">¿Tu empresa todavía no tiene cuenta corriente? ${st.cfg.telefono ? `Llamá al <a href="tel:${esc(st.cfg.telefono)}">${esc(st.cfg.telefono)}</a> o tocá <b>Ayuda</b>` : 'Tocá <b>Ayuda</b> arriba'} y pedila.</p>`}</div>
    <div class="otros-ingresos"><span>¿Necesitás ayuda?</span><a href="#" id="ayuda3">💬 Ayuda</a></div>`);
  $('#ayuda3').onclick = e => { e.preventDefault(); $('#ayuda').click(); };
  if ($('#pedirEmp')) $('#pedirEmp').onclick = () => ir('pedir');
  if (corp) empViajesCC(corp);
  if ($('#xc2')) $('#xc2').onclick = e => { e.preventDefault(); LS.del('rodar_corp'); history.replaceState({}, '', location.pathname); ir(S.cli ? 'pedir' : 'ingresar'); };
  if (!$('#fe')) return;
  $('#vere').onclick = () => { const x = $('#pwe'); x.type = x.type === 'password' ? 'text' : 'password'; };
  $('#fe').onsubmit = async e => {
    e.preventDefault(); const er = $('#erre'); er.textContent = ''; const btn = $('#oke'); btn.disabled = true;
    try {
      const r = await RODAR.llamar('/api/login', 'POST', { usuario: e.target.usuario.value.trim(), password: e.target.password.value, tipo: 'empresa' }, null);
      if (!r.usuario.roles.includes('corporativo')) throw new Error('Este usuario no es de una empresa. Si sos pasajero, ingresá desde Ingresar.');
      try { await RODAR.llamar('/api/emp/inicio', 'GET', null, r.token); }
      catch (y) { RODAR.llamar('/api/logout', 'POST', {}, r.token).catch(() => { }); throw new Error(/no es de una empresa|ninguna empresa/i.test(y.message) ? 'Tu usuario no está asociado a ninguna empresa. Pedile a la central que te cree un usuario de empresa.' : y.message); }
      LS.set('rodar_corp', JSON.stringify({ token: r.token, nombre: r.usuario.nombre + ' ' + r.usuario.apellido }));
      ir('pedir');
    } catch (x) { er.textContent = x.message; btn.disabled = false; }
  };
}
