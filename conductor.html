<script>
const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];

const NATIVO = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

    LN.requestPermissions().catch(() => { });

// GPS nativo: sigue mandando la ubicación con la pantalla bloqueada
function nativoGps(ok, fallo) {
  const BGL = plug('BackgroundGeolocation'); if (!BGL || S.bgWatcher) return;
  // Según la versión del puente de Android, addWatcher devuelve una promesa o directamente el id (texto): se aceptan las dos
  S.bgWatcher = 'pend';
  let w; try { w = BGL.addWatcher({ backgroundTitle: 'Remises TOQUE! · En servicio', backgroundMessage: 'Tu ubicación se envía a la central. Tocá para abrir la app.', requestPermissions: true, stale: false, distanceFilter: 0 },
    (loc, err) => {
      if (err) {
        fallo({ code: err.code === 'NOT_AUTHORIZED' ? 1 : 2 });
        if (err.code === 'NOT_AUTHORIZED' && confirm('La app necesita permiso de ubicación para recibir viajes. ¿Abrir los ajustes?')) BGL.openSettings();
        return;
      }
      if (!loc) return;
      ok({ coords: { latitude: loc.latitude, longitude: loc.longitude, speed: loc.speed || 0 } });
      if (S.enFondo && Date.now() - (S.ultRevFondo || 0) > 10000) revisarFondo();
    }); } catch (er) { S.bgWatcher = null; return; }

}
// Con la app en segundo plano se consulta el estado cada ~10 s (el tiempo real puede cortarse) y se avisa con una notificación
async function revisarFondo() {

  await refrescar();
  const v = S.estado && S.estado.viaje;

    S.ultRevSop = Date.now();
    try { const ms = await api('/api/conductor/soporte'); const u = ms.filter(m => m.de !== 'movil').pop(); const visto = +(lsGet(SOP_VISTO) || 0);
      if (u && u.id > visto && u.id !== S.sopAvisado) { S.sopAvisado = u.id; notificar('💬 Mensaje de la Central', u.texto + '\nTocá para responder', '#soporte', 'rodar-soporte'); } } catch { }
  }
}
const idDeTag = t => { let h = 7; for (const c of String(t || 'rodar')) h = (h * 31 + c.charCodeAt(0)) % 2000000000; return h; };

  $$('.tk-ov').forEach(x => x.remove());

  ov.innerHTML = `<div class="tk-bar"><button class="tk-vol">← Volver</button><button class="tk-imp">🖨 Imprimir / PDF</button></div><iframe title="Ticket de viaje"></iframe>`;
  document.body.append(ov);
  const fr = $('iframe', ov);
  fr.srcdoc = ticketHtml(v, {}).replace('<div class="barra">', '<div class="barra" style="display:none">');
  const volver = () => { document.removeEventListener('visibilitychange', alVolver); ov.remove(); limpiarCobro(); cerrarHoja(); refrescar(); };
  const alVolver = () => { if (!document.hidden && S.tkExterno) { S.tkExterno = false; volver(); } };
  $('.tk-vol', ov).onclick = volver;
  $('.tk-imp', ov).onclick = () => {
    if (NATIVO) {
      // Se abre fuera de la app (remisestoque.netlify.app es otro dominio, así Android lo manda a Chrome) con los datos en el enlace
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(v)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

}
function toast(m, t) { let c = $('#toasts'); if (!c) { c = document.createElement('div'); c.id = 'toasts'; document.body.append(c); } const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; c.append(e); setTimeout(() => e.remove(), 4000); }

  async function entrar(cred, m) {

// Fotos: se achican a 1400 px en JPEG para que la solicitud viaje liviana. PDF: hasta 1,5 MB.
function achicarArchivo(fi) {
  if (!/^image\//.test(fi.type)) return RODAR.archivoADataURL(fi).then(r => r.archivo);
  return new Promise((res, rej) => {

    <div class="mpie">Remises TOQUE! · Conductor</div></div>`;
  $('.mx', $('#lat')).onclick = cerrarMenu;
  $$('#lat [data-k]').forEach(a => a.onclick = () => { cerrarMenu(); S.volverMenu = true; Promise.resolve(menu(a.dataset.k)).catch(er => toast(er.message, 'error')).finally(() => { S.volverMenu = false; }); });
  pintarNoLeidos();
}
function pintarFueraMenu() { const t = $('#fueraTx'); if (t && S.estado) t.textContent = S.estado.movil.estado === 'fuera_servicio' ? '▶️ Ponerme libre' : '⏸️ Fuera de servicio'; }
async function fueraDeServicio() {
  const m = S.estado.movil, salir = m.estado === 'fuera_servicio';
  if (!salir && (S.estado.viaje || ['confirmado', 'con_pasajero'].includes(m.estado))) return toast('Terminá el viaje en curso antes de pasar a fuera de servicio', 'error');
  try {
    await api('/api/conductor/estado', { estado: salir ? 'disponible' : 'fuera_servicio' });
    if (!salir) { S.fueraDesde = new Date().toTimeString().slice(0, 5); lsSet('rodar_fuera_desde', S.fueraDesde); }
    toast(salir ? 'Estás libre' : 'Fuera de servicio', 'ok'); refrescar();
  } catch (er) { toast(er.message, 'error'); }
}
// Abre la app de Mercado Pago; si no está instalada (o no responde), abre la web. Si la app se abrió, no se abre además la web.
function abrirMercadoPago() {
  const web = 'https://www.mercadopago.com.ar/', android = /android/i.test(navigator.userAgent), ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (NATIVO) { // en la app Android: intenta abrir la app de Mercado Pago; si no está instalada, abre la web
    let fue = false; const v = () => { if (document.hidden) fue = true; }; document.addEventListener('visibilitychange', v);
    try { location.href = 'mercadopago://home'; } catch { }
    setTimeout(() => { document.removeEventListener('visibilitychange', v); if (!fue && !document.hidden) location.href = web; }, 1500); return;
  }
  if (!android && !ios) return window.open(web, '_blank', 'noopener');
  let salio = false; const vis = () => { if (document.hidden) salio = true; };
  document.addEventListener('visibilitychange', vis);
  if (android) location.href = 'intent://#Intent;scheme=mercadopago;package=com.mercadopago.wallet;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  else location.href = 'mercadopago://';
  setTimeout(() => { document.removeEventListener('visibilitychange', vis); if (!salio && !document.hidden && ios) window.open(web, '_blank'); }, 1500);
}
// ---- Mis viajes (últimos 7 días) ----
async function misViajesCond() {
  let vs; try { vs = await api('/api/conductor/viajes'); } catch (er) { return toast(er.message, 'error'); }
  const EV = { finalizado: ['Finalizado', '#2f9e57'], anulado: ['Cancelado', '#d64545'], en_curso: ['En curso', '#e8892b'], confirmado: ['Asignado', '#2f6fd6'], ofrecido: ['Ofrecido', '#7b8a8b'], pendiente: ['Pendiente', '#7b8a8b'], reserva: ['Reserva', '#6c4fd6'] };
  const fin = vs.filter(v => v.estado === 'finalizado'), total = fin.reduce((a, v) => a + (+v.monto || 0), 0), km = fin.reduce((a, v) => a + (+v.km || 0), 0);
  const dia = f => { const d = String(f || '').slice(0, 10), hoy = new Date(), ay = new Date(Date.now() - 864e5), iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    if (d === iso(hoy)) return 'Hoy'; if (d === iso(ay)) return 'Ayer';
    const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][x.getDay()] + ' ' + x.getDate() + '/' + (x.getMonth() + 1); };
  const grupos = []; vs.forEach(v => { const g = dia(v.creado); let x = grupos.find(y => y.g === g); if (!x) grupos.push(x = { g, vs: [] }); x.vs.push(v); });
  const medio = m => ({ efectivo: '💵 Efectivo', mercadopago: '💳 Mercado Pago', cuenta_corriente: '🏢 Cuenta corriente', transferencia: '🏦 Transferencia' })[m] || (m ? esc(String(m).replace(/_/g, ' ')) : '');
  const tarjeta = v => { const [et, ec] = EV[v.estado] || [v.estado, '#7b8a8b'];
    return `<div class="vj${v.estado === 'anulado' ? ' an' : ''}"><div class="vj1"><span class="vjh">${esc(String(v.creado || '').slice(11, 16))}</span><span class="vjn">#${v.id}</span><span class="vje" style="background:${ec}">${et}</span><b class="vjm">${v.monto != null && v.estado !== 'anulado' ? pesos(v.monto) : ''}</b></div>
      <div class="vjr"><div><i class="o"></i>${esc(v.origen_dir || '—')}</div><div><i class="d"></i>${esc(v.destino_dir || 'Sin destino')}</div></div>
      <div class="vj2">${v.km ? `<span class="ch">🛣 ${km1(v.km)} km</span>` : ''}${medio(v.medio_pago) ? `<span class="ch">${medio(v.medio_pago)}</span>` : ''}${v.estado === 'finalizado' ? `<button class="vjt" data-tk="${v.id}">🧾 Ticket</button>` : ''}</div></div>`; };
  const el = hoja('Mis viajes', `<div class="vjres"><div><small>Viajes</small><b>${fin.length}</b></div><div><small>Recaudado</small><b>${pesos(total)}</b></div><div><small>Recorrido</small><b>${km1(km)} km</b></div></div>
    <p class="vjsub">Últimos 7 días · ${vs.length} viaje${vs.length === 1 ? '' : 's'} en total</p>
    ${grupos.length ? grupos.map(g => `<div class="vjg">${g.g}<span>${g.vs.filter(v => v.estado === 'finalizado').length ? pesos(g.vs.filter(v => v.estado === 'finalizado').reduce((a, v) => a + (+v.monto || 0), 0)) : ''}</span></div>${g.vs.map(tarjeta).join('')}`).join('') : '<div class="vjvac"><div style="font-size:42px">🚕</div><b>Todavía no hiciste viajes esta semana</b><p>Cuando termines un viaje lo vas a ver acá con su ticket.</p></div>'}`);
  el.classList.add('h-viajes');
  $$('[data-tk]', el).forEach(b => b.onclick = () => ticket(+b.dataset.tk));
}
// hojas / menú
// Pantallas que se abren desde el menú: mismo estilo que el menú y "‹" para volver al menú con todas las opciones.
function hoja(t, html) {
  const prev = $('.hoja'), desdeMenu = !!(S.volverMenu || (prev && prev.dataset.menu === '1')); S.volverMenu = false;
  cerrarHoja();
  const el = document.createElement('div'); el.className = 'hoja'; el.dataset.menu = desdeMenu ? '1' : '';
  el.innerHTML = `<div class="ht">${desdeMenu ? '<button class="hv" aria-label="Volver al menú">‹</button>' : ''}<b>${esc(t)}</b><button class="hx" aria-label="Cerrar">×</button></div><div class="hb"><div class="hc">${html}</div></div>`;
  document.body.append(el);
  const v = $('.hv', el); if (v) v.onclick = volverAlMenu;
  $('.hx', el).onclick = () => cerrarHoja();
  return el;
}
function volverAlMenu() { cerrarHoja(); abrirMenu(); }
function cerrarHoja() { $$('.hoja').forEach(x => x.remove()); }
async function menu(k) {
  const e = S.estado;
  if (k === 'soporte') return abrirSoporte();
  if (k === 'perfil') {
    let p = {}; try { p = await api('/api/conductor/perfil'); } catch (er) { return toast(er.message, 'error'); }
    const el = hoja('Mi perfil', `<p style="margin:0 0 10px"><b>DNI ${esc(p.documento || '')}</b> · Móvil ${e.movil.numero} · ${esc(e.movil.marca || '')} ${esc(e.movil.modelo || '')} · ${esc(e.movil.patente || '')}<br><small style="opacity:.75">El DNI y los datos del auto los cambia la central.</small></p>
      <form id="fp"><div class="grid g2">
        <div class="campo"><label>Nombre</label><input name="nombre" value="${esc(p.nombre || '')}" required></div>
        <div class="campo"><label>Apellido</label><input name="apellido" value="${esc(p.apellido || '')}"></div>
        <div class="campo"><label>Teléfono</label><input name="telefono" type="tel" inputmode="tel" value="${esc(p.telefono || '')}"></div>
        <div class="campo"><label>Email</label><input name="email" type="email" autocapitalize="none" value="${esc(p.email || '')}"></div>
        <div class="campo"><label>Teléfono de recupero</label><input name="tel_recupero" type="tel" inputmode="tel" value="${esc(p.tel_recupero || '')}"></div>
        <div class="campo"><label>Email de recupero</label><input name="email_recupero" type="email" autocapitalize="none" value="${esc(p.email_recupero || '')}"></div>
      </div><button class="btn grande" style="margin-top:12px">Guardar mis datos</button></form>
      <p style="font-size:13px;opacity:.75;margin-top:10px">Tu alias y tu billetera se cargan en <b>Mi billetera virtual</b>.</p>`);
    $('#fp', el).onsubmit = async ev => { ev.preventDefault(); const btn = $('button', ev.target); btn.disabled = true;
      try { await api('/api/conductor/perfil', Object.fromEntries(new FormData(ev.target))); toast('Datos guardados', 'ok'); cerrarHoja(); await refrescar(); const n = $('.hd div div'); if (n && S.estado) n.textContent = S.estado.conductor.nombre + ' ' + S.estado.conductor.apellido; }
      catch (er) { toast(er.message, 'error'); btn.disabled = false; } };
  }
  if (k === 'viajes') return misViajesCond();
  if (k === 'saldo') await pagarBase();
  if (k === 'billetera') {
    let b = {}; try { b = await api('/api/conductor/billetera'); } catch (er) { return toast(er.message, 'error'); }
    const TIPOS = [['mercadopago', 'Mercado Pago'], ['uala', 'Ualá'], ['naranja_x', 'Naranja X'], ['brubank', 'Brubank'], ['personal_pay', 'Personal Pay'], ['otra', 'Otra billetera o banco']];
    const el = hoja('Mi billetera virtual', `<p style="font-size:14px;opacity:.85;margin:0 0 10px">Indicá el alias o CVU donde querés recibir tus pagos. Lo ve la central.</p>
      <form id="bf"><div class="campo"><label>Billetera</label><select name="tipo" style="width:100%;padding:10px;border-radius:8px">${TIPOS.map(([c, n]) => `<option value="${c}" ${c === (b.tipo || 'mercadopago') ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="campo"><label>Alias o CVU</label><input name="alias" value="${esc(b.alias || '')}" placeholder="ej: juan.perez.mp" autocapitalize="none" autocomplete="off"></div>
      <button class="btn grande">Guardar</button>${b.alias ? '<button type="button" class="btn grande sec" id="bq" style="margin-top:8px">Quitar mi billetera</button>' : ''}</form>`);
    $('#bf', el).onsubmit = async ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(ev.target)); if (!String(d.alias || '').trim()) return toast('Escribí tu alias o CVU', 'error'); try { const r = await api('/api/conductor/billetera', d, 'PUT'); toast('Billetera guardada: ' + r.alias, 'ok'); cerrarHoja(); } catch (er) { toast(er.message, 'error'); } };
    if ($('#bq', el)) $('#bq', el).onclick = async () => { if (!confirm('¿Quitar tu billetera virtual?')) return; try { await api('/api/conductor/billetera', { alias: '' }, 'PUT'); toast('Billetera quitada', 'ok'); cerrarHoja(); } catch (er) { toast(er.message, 'error'); } };
  }
  if (k === 'clave') {
    const el = hoja('Cambiar clave', '<form id="cf"><div class="campo"><label>Actual</label><input type="password" name="actual"></div><div class="campo"><label>Nueva</label><input type="password" name="nueva"></div><button class="btn grande">Guardar</button></form>');
    $('#cf', el).onsubmit = async ev => { ev.preventDefault(); try { await api('/api/me/password', Object.fromEntries(new FormData(ev.target))); toast('Clave actualizada', 'ok'); cerrarHoja(); } catch (er) { toast(er.message, 'error'); } };
  }
  if (k === 'modo') {
    const md = await api('/api/conductor/modos'), rp = md.repartidor, d = md.datos || {};
    const VEH = { moto: '🏍 Moto', auto: '🚗 Auto' };
    const lista = md.moviles.map(x => `<button class="btn ${x.id === md.actual ? '' : 'sec'}" data-mv="${x.id}" ${x.id === md.actual ? 'disabled' : ''} style="width:100%;justify-content:flex-start;margin-bottom:8px;text-align:left"><span>${x.es_reparto ? '🛵 Repartidor' : '🚕 Conductor'} · Móvil <b>${x.numero}</b> · ${esc(x.patente || '')}${x.es_reparto ? ' · ' + (VEH[x.tipo_vehiculo] || '') : ''}${x.id === md.actual ? ' <small>(usando ahora)</small>' : ''}${x.es_reparto && rp && rp.estado !== 'aprobado' ? ' <small>(' + (rp.estado === 'pendiente' ? 'en revisión' : esc(rp.estado)) + ')</small>' : ''}</span></button>`).join('');
    const pedir = !rp ? `<div class="fs-card" style="margin-top:12px"><h3 style="margin:0 0 6px">🛵 Quiero repartir también</h3><p style="margin:0 0 10px;color:#6b7a7b">Usás esta misma cuenta. La central revisa tu pedido y te habilita; ahí podés pasar a repartidor desde acá, sin cerrar sesión.</p>
      <form id="rf"><div class="campo"><label>¿En qué vas a repartir?</label><select name="vehiculo"><option value="moto">🏍 Moto</option><option value="auto" ${d.tipo_vehiculo === 'auto' ? 'selected' : ''}>🚗 Auto</option></select></div>
      <div class="campo"><label>Patente</label><input name="patente" value="${esc(d.patente || '')}" style="text-transform:uppercase" required></div><div class="campo"><label>Marca y modelo (opcional)</label><input name="marca" placeholder="Ej: Honda Wave"></div>
      <button class="btn verde grande" style="width:100%">Enviar solicitud</button></form></div>`
      : rp.estado === 'pendiente' ? '<div class="fs-card" style="margin-top:12px">⏳ <b>Tu solicitud de repartidor está en revisión.</b> Te avisamos cuando la central te habilite.</div>'
      : rp.estado !== 'aprobado' ? `<div class="fs-card" style="margin-top:12px">⛔ Tu cuenta de repartidor está <b>${esc(rp.estado)}</b>.${rp.motivo ? '<br>' + esc(rp.motivo) : ''}</div>` : '';
    const el = hoja('Modo de trabajo', `<p style="margin-top:0;color:#6b7a7b">Elegí con qué móvil trabajás. Para cambiar tenés que estar sin viaje o pedido en curso.</p>${lista}${pedir}<p style="text-align:center;margin-top:14px"><a href="repartidor.html" target="_blank">Abrir mi portal de repartidor (ganancias y entregas)</a></p>`);
    $$('[data-mv]', el).forEach(b => b.onclick = async () => { if (!confirm('¿Cambiar de móvil? Vas a quedar conectado con el nuevo.')) return; try { await api('/api/conductor/cambiar-movil', { movil_id: +b.dataset.mv }); toast('Listo, cambiaste de móvil', 'ok'); location.reload(); } catch (er) { toast(er.message, 'error'); } });
    const rf = $('#rf', el); if (rf) rf.onsubmit = async ev => { ev.preventDefault(); try { await api('/api/conductor/repartidor', Object.fromEntries(new FormData(rf))); toast('Solicitud enviada a la central', 'ok'); cerrarHoja(); } catch (er) { toast(er.message, 'error'); } };
  }
  if (k === 'fuera') await fueraDeServicio();
  if (k === 'manual') window.open('manual-conductor.html', '_blank');
  if (k === 'apk') hoja('App Android', `<div class="fs-card"><div class="ic">📲</div><h2>App Android del conductor</h2><p>Con la app instalada, el GPS y los avisos de viajes siguen funcionando aunque bloquees el celular.</p></div>
    <ol style="line-height:1.7;padding-left:20px"><li>Tocá <b>Descargar</b> y abrí el archivo <b>toque-conductor.apk</b>.</li><li>Si el celular lo pide, permití <b>instalar apps de esta fuente</b>.</li><li>Abrí <b>TOQUE! Conductor</b>, ingresá y aceptá los permisos de ubicación, notificaciones y batería.</li></ol>
    <a class="btn verde grande" style="width:100%;text-align:center;display:block" href="${APK_URL}">⬇️ Descargar la app</a>`);
  if (k === 'cerrar') { if (confirm('¿Cerrar sesión? Vas a quedar desconectado.')) salir(false, true); }
}
async function salir(silencio, cerrarApp) {
  try { if (!silencio) await api('/api/conductor/salir', { cerrar_app: !!cerrarApp }); } catch { }
  try { if (S.bgWatcher && S.bgWatcher !== 'pend' && S.bgWatcher !== 'activo') await plug('BackgroundGeolocation').removeWatcher({ id: S.bgWatcher }); } catch { }
  localStorage.removeItem('rodar_cond_token'); TK = null; S.socket && S.socket.cerrar(); location.reload();
}
if (!RODAR.listo) document.getElementById('root').innerHTML = '<div class="login-c"><h2>Falta configurar config.js</h2><p>Completá la URL y la clave de Supabase (ver README).</p></div>';
else if (TK) iniciar(); else { pantallaLogin(); if (location.hash === '#alta') formAlta(); }
